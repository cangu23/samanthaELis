kind = "web"
previewPath = "/"
title = "Cerebrito - Plataforma de Conocimientos"
version = "1.0.0"
id = "artifacts/cerebrito"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21627

[services.development]
run = "pnpm --filter @workspace/cerebrito run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cerebrito", "run", "build" ]
publicDir = "artifacts/infoquest/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21627"
BASE_PATH = "/"
