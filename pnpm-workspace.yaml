# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================

minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync
  - typescript
  - zod

packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/bcrypt': ^6.0.0
  '@types/node': ^22.12.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  '@hookform/resolvers': 3.10.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  drizzle-zod: 0.8.3
  bcrypt: ^6.0.0
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^6.1.0
  zod: 4.4.3

overrides:
  zod: 4.4.3
  drizzle-zod: 0.8.3
  '@hookform/resolvers': 3.10.0

  esbuild>@esbuild/darwin-arm64: '-'
  esbuild>@esbuild/darwin-x64: '-'
  esbuild>@esbuild/freebsd-arm64: '-'
  esbuild>@esbuild/freebsd-x64: '-'
  esbuild>@esbuild/linux-arm: '-'
  esbuild>@esbuild/linux-arm64: '-'
  esbuild>@esbuild/linux-ia32: '-'
  esbuild>@esbuild/linux-loong64: '-'
  esbuild>@esbuild/linux-mips64el: '-'
  esbuild>@esbuild/linux-ppc64: '-'
  esbuild>@esbuild/linux-riscv64: '-'
  esbuild>@esbuild/linux-s390x: '-'
  esbuild>@esbuild/win32-arm64: '-'
  esbuild>@esbuild/win32-ia32: '-'
  esbuild>@esbuild/win32-x64-gnu: '-'
  esbuild>@esbuild/win32-x64-msvc: '-'

  '@esbuild-kit/esm-loader': 'npm:tsx@^4.21.0'
  esbuild: 0.27.7

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - bcrypt
  - msw
  - unrs-resolver

allowBuilds:
  bcrypt: true
  esbuild: true